<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuestro Baile Inolvidable 💛</title>

<style>
body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    scroll-behavior:smooth;
}

/* ================= PANTALLA INICIAL ================= */

.overlay{
    position:fixed;
    inset:0;
    background:url("img/fondo-b-difu.jpg") center/cover no-repeat;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:100;
    transition:opacity 1s ease;
}

.overlay::after{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.4);
}

.overlay button{
    position:relative;
    padding:15px 35px;
    font-size:18px;
    border:none;
    border-radius:40px;
    background:#F5E6D3;
    color:#5a4033;
    cursor:pointer;
    z-index:2;
    transition:0.3s;
}

.overlay button:hover{
    transform:scale(1.08);
}

/* ================= SECCIÓN CARTA ================= */

.section1{
    min-height:100vh;
    background:url("img/fondo-b-normal.jpg") center/cover no-repeat;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px;
}

.card{
    background:#f3e7d9;
    padding:40px;
    border-radius:20px;
    max-width:600px;
    box-shadow:0 10px 40px rgba(0,0,0,0.3);
    text-align:center;
}

.card h1{
    color:#6b3e2e;
}

.card p{
    color:#5a4033;
}

.counter{
    margin-top:20px;
    font-weight:bold;
}

/* ================= SECCIÓN GALERÍA ================= */

.section2{
    position:relative;
    overflow:hidden;
    background:#FFF8DC;
    padding:80px 20px;
}

.gallery{
    display:flex;
    flex-direction:column;
    gap:60px;
    max-width:800px;
    margin:auto;
    position:relative;
    z-index:2;
}

.gallery img{
    width:100%;
    border-radius:20px;
    box-shadow:0 8px 25px rgba(0,0,0,0.25);
    transform:rotate(calc(-3deg + 6deg * var(--r)));
}

/* ================= GIRASOLES ================= */

.sunflower{
    position:absolute;
    opacity:0.95;
    z-index:1;
    pointer-events:none;
    animation:float 5s ease-in-out infinite alternate;
}

@keyframes float{
    from{ transform:translateY(0px) rotate(0deg); }
    to{ transform:translateY(-25px) rotate(10deg); }
}

/* ================= MENSAJE FINAL ================= */

.final-message{
    margin-top:80px;
    font-size:13px;
    color:#6b3e2e;
    opacity:0.7;
    text-align:center;
}

</style>
</head>

<body>

<div class="overlay" id="overlay">
    <button onclick="startExperience()">Entrar 💛</button>
</div>

<!-- SECCIÓN 1 -->
<section class="section1">
    <div class="card">
        <h1>Para el amor de mi vida 💛</h1>

        <p>Gracias por cada momento, cada risa, cada recuerdo.</p>
        <p>Hemos construido algo hermoso desde el 11 de mayo de 2023.</p>
        <p><strong>Y esto apenas comienza.</strong></p>

        <h3 style="margin-top:25px; color:#6b3e2e;">
            Este es el tiempo a tu lado 💛
        </h3>

        <div class="counter">
            <div id="time"></div>
        </div>
    </div>
</section>

<!-- SECCIÓN 2 -->
<section class="section2">
    <div class="gallery">

<!-- 52 IMÁGENES -->
<script>
for(let i=1;i<=51;i++){
    document.write('<div><img src="img/img'+i+'-carta.jpeg" style="--r:'+Math.random()+';"></div>');
}
</script>

    </div>

<p class="final-message">
    Con mucho amor, de tu persona favorita para ti 💛
</p>

</section>

<audio id="music" loop>
<source src="DtMF-pista.mp3" type="audio/mp3">
</audio>

<script>

/* CONTADOR */
const startDate = new Date("2023-05-11T00:00:00");

function updateTime(){
    const now = new Date();
    const diff = now - startDate;

    const days = Math.floor(diff / (1000*60*60*24));
    const hours = Math.floor(diff / (1000*60*60) % 24);
    const minutes = Math.floor(diff / (1000*60) % 60);
    const seconds = Math.floor(diff / 1000 % 60);

    document.getElementById("time").innerHTML =
    days+" días "+hours+" horas "+
    minutes+" minutos "+seconds+" segundos";
}

setInterval(updateTime,1000);
updateTime();

/* INICIAR EXPERIENCIA */
function startExperience(){
    document.getElementById("music").play();
    document.getElementById("overlay").style.opacity="0";
    setTimeout(()=>{
        document.getElementById("overlay").style.display="none";
    },1000);
}

/* GENERAR GIRASOLES */
function createSunflowers(){
    const section = document.querySelector(".section2");
    const total = 120;

    for(let i=0;i<total;i++){

        const flower = document.createElement("img");
        flower.src = "img/girasol-f.png";
        flower.classList.add("sunflower");

        flower.style.top = Math.random()*100+"%";
        flower.style.left = Math.random()*100+"%";
        flower.style.width = (40+Math.random()*80)+"px";
        flower.style.animationDuration = (3+Math.random()*5)+"s";
        flower.style.transform = "rotate("+Math.random()*360+"deg)";

        section.appendChild(flower);
    }
}

createSunflowers();

</script>

</body>
</html>
